<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Scores — Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --felt-dark: #0A2B20;
    --felt: #0F3D2E;
    --felt-light: #164A38;
    --parchment: #F4EDD9;
    --parchment-dim: #E8DFC5;
    --ink: #1C2318;
    --ink-soft: #4A4A3E;
    --brass: #C9A15A;
    --brass-bright: #DDBB78;
    --brass-dark: #8A6C34;
    --burgundy: #7A2E33;
    --burgundy-bright: #A8434A;
    --sage: #8FA88E;
    --sage-dim: #6B8169;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--felt-dark);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.03) 0%, transparent 50%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    font-family: 'Inter', sans-serif;
    color: var(--parchment);
    min-height: 100vh;
  }
  .frame { max-width: 480px; margin: 0 auto; padding: 32px 20px 60px; }
  .eyebrow {
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--sage); font-weight: 600; margin: 0 0 6px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .eyebrow::before, .eyebrow::after { content: ''; width: 14px; height: 1px; background: var(--sage-dim); }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 32px;
    line-height: 1.1; margin: 0 0 6px; color: var(--parchment); letter-spacing: -0.01em;
    text-align: center;
  }
  .subhead { font-size: 14px; color: var(--sage); margin: 0 0 28px; text-align: center; }

  .podium {
    display: flex; align-items: flex-end; justify-content: center; gap: 10px;
    margin-bottom: 28px;
  }
  .podium-slot { display: flex; flex-direction: column; align-items: center; width: 100px; }
  .podium-avatar {
    width: 52px; height: 52px; border-radius: 50%; background: var(--parchment);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 19px; color: var(--ink);
    margin-bottom: 8px; border: 3px solid var(--brass);
  }
  .podium-slot.second .podium-avatar, .podium-slot.third .podium-avatar {
    border-color: rgba(143,168,142,0.5); width: 44px; height: 44px; font-size: 16px;
  }
  .podium-name { font-size: 13px; font-weight: 600; color: var(--parchment); margin: 0 0 2px; text-align: center; }
  .podium-score {
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 20px;
    color: var(--brass-bright); margin: 0 0 8px; font-variant-numeric: tabular-nums;
  }
  .podium-slot.second .podium-score, .podium-slot.third .podium-score { color: var(--sage); font-size: 17px; }
  .podium-bar {
    width: 100%; border-radius: 8px 8px 0 0;
    background: linear-gradient(180deg, var(--felt-light), var(--felt));
    border: 1px solid rgba(201,161,90,0.2); border-bottom: none;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 6px;
  }
  .podium-slot.first .podium-bar { height: 64px; border-color: var(--brass); }
  .podium-slot.second .podium-bar { height: 44px; }
  .podium-slot.third .podium-bar { height: 28px; }
  .podium-rank { font-family: 'Fraunces', serif; font-weight: 700; font-size: 15px; color: var(--brass-bright); }
  .podium-slot.second .podium-rank, .podium-slot.third .podium-rank { color: var(--sage-dim); }

  .card {
    background: var(--parchment); border-radius: 14px; padding: 6px 6px;
    margin-bottom: 20px; position: relative;
    box-shadow: 0 8px 24px rgba(0,0,0,0.28), 0 1px 0 rgba(255,255,255,0.4) inset;
  }
  .rank-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 12px;
    border-bottom: 1px solid rgba(28,35,24,0.08);
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-num {
    width: 24px; text-align: center; font-family: 'Fraunces', serif; font-weight: 700;
    font-size: 15px; color: var(--ink-soft); flex-shrink: 0;
  }
  .rank-row.top .rank-num { color: var(--brass-dark); }
  .rank-name { flex: 1; font-size: 15px; font-weight: 600; color: var(--ink); }
  .rank-score {
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 18px; color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .action-row { display: flex; flex-direction: column; gap: 10px; }
  .action-btn {
    width: 100%; padding: 15px; border-radius: 10px; font-size: 15px; font-weight: 600;
    cursor: pointer; text-align: center;
  }
  .action-btn.primary {
    background: linear-gradient(180deg, var(--brass-bright), var(--brass));
    border: none; color: var(--ink); font-family: 'Fraunces', serif; font-size: 16px;
    box-shadow: 0 4px 14px rgba(201,161,90,0.35);
  }
  .action-btn.secondary {
    background: transparent; border: 1px solid rgba(143,168,142,0.35); color: var(--parchment);
  }
  .action-row-split { display: flex; gap: 10px; }
  .action-row-split .action-btn.secondary { flex: 1; }
</style>
</head>
<body>
<div class="frame">

  <p class="eyebrow">Session complete</p>
  <h1>Final scores</h1>
  <p class="subhead">Played to 7 rounds, 5&#8209;card hands down to 1.</p>

  <div class="podium">
    <div class="podium-slot second">
      <div class="podium-avatar">R</div>
      <p class="podium-name">Robert</p>
      <p class="podium-score">71</p>
      <div class="podium-bar"><span class="podium-rank">2</span></div>
    </div>
    <div class="podium-slot first">
      <div class="podium-avatar">M</div>
      <p class="podium-name">Magda</p>
      <p class="podium-score">87</p>
      <div class="podium-bar"><span class="podium-rank">1</span></div>
    </div>
    <div class="podium-slot third">
      <div class="podium-avatar">P</div>
      <p class="podium-name">Priya</p>
      <p class="podium-score">55</p>
      <div class="podium-bar"><span class="podium-rank">3</span></div>
    </div>
  </div>

  <div class="card">
    <div class="rank-row top">
      <span class="rank-num">1</span>
      <span class="rank-name">Magda</span>
      <span class="rank-score">87</span>
    </div>
    <div class="rank-row">
      <span class="rank-num">2</span>
      <span class="rank-name">Robert</span>
      <span class="rank-score">71</span>
    </div>
    <div class="rank-row">
      <span class="rank-num">3</span>
      <span class="rank-name">Priya</span>
      <span class="rank-score">55</span>
    </div>
  </div>

  <div class="action-row">
    <button class="action-btn primary">Save and start a new session</button>
    <div class="action-row-split">
      <button class="action-btn secondary">Export this session</button>
      <button class="action-btn secondary">View history and stats</button>
    </div>
  </div>

</div>
</body>
</html>
